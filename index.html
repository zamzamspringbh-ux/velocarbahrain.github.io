<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>VELOCAR Bahrain</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #083b70;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 260px;
      max-width: 85%;
      margin-bottom: 15px;
    }

    h1 {
      margin: 5px 0;
      font-size: 26px;
      color: #073d72;
    }

    .tagline {
      margin-bottom: 30px;
      color: #b88916;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .button {
      display: block;
      width: 100%;
      margin: 14px 0;
      padding: 17px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      background: #073d72;
      color: white;
      border: 2px solid #d7a62a;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.02);
      background: #0a4b89;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #777;
    }

  </style>

</head>

<body>

  <div class="container">

    <img src="logo.png"
         alt="VELOCAR Logo"
         class="logo">

    <h1>VELOCAR</h1>

    <div class="tagline">
      Cleaner Cars | Brighter Days
    </div>

    <a class="button"
       href="https://wa.me/97337799338"
       target="_blank">
       WhatsApp
    </a>

    <a class="button"
       href="https://www.instagram.com/velocar.bh/"
       target="_blank">
       Instagram
    </a>

    <a class="button"
       href="https://www.tiktok.com/@velocar.bh"
       target="_blank">
       TikTok
    </a>

    <div class="footer">
      VELOCAR Bahrain — Wash On Wheels
    </div>

  </div>

</body>
</html>
